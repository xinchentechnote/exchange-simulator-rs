[package]
name = "exchange-simulator-rs"
version = "0.1.0"
edition = "2024"

[dependencies]

sse-binary = { git = "https://github.com/xinchentechnote/fin-proto-sse-bin-rs.git", tag = "v0.1.0" }
binary-codec = { git = "https://github.com/xinchentechnote/fin-proto-runtime-bin-rs.git", tag = "v0.1.0" }
matching-core = { git = "https://github.com/xinchentechnote/matching-core.git", tag = "v0.2.2" }
bytes = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1"
toml = "1.1.0"
axum = "0.8.9"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
validator = { version = "0.20.0", features = ["derive"] }
anyhow = "1.0.102"
tokio = { version = "1.52.3", features = ["full"] }
